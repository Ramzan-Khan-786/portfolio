<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        const saved = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = [
          'dark',
          'light',
          'midnight',
          'graphite',
          'terminal',
        ].includes(saved)
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta
      name="description"
      content="Ramzan Khan's engineering portfolio and interactive project showroom."
    />
    <meta property="og:title" content="Ramzan Khan — Engineering Portfolio" />
    <meta
      property="og:description"
      content="Engineering work, systems thinking, and interactive project demonstrations."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23294a3b'/%3E%3Ctext x='32' y='42' font-size='27' text-anchor='middle' fill='white' font-family='Arial'%3ERK%3C/text%3E%3C/svg%3E"
    />
    <title>Ramzan Khan — Engineering Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
